<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 264px; margin: 0; padding: 16px;
      font: 400 13px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: light-dark(#ffffff, #1f2127);
      color: light-dark(#111827, #eceef2);
    }
    .brand { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 7px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; vertical-align: middle; margin-right: 2px; }
    .dot.on { background: #10b981; } .dot.off { background: #ef4444; }
    .status { color: light-dark(#6b7280, #9aa1ad); font-size: 12px; margin: 6px 0 14px; }
    button {
      width: 100%; padding: 9px 12px; border-radius: 9px; cursor: pointer;
      font: 600 12.5px/1 system-ui, sans-serif;
      background: #4f46e5; color: #fff; border: 0;
    }
    button:hover { background: #4338ca; }
    .tip {
      margin-top: 12px; font-size: 11.5px; color: light-dark(#6b7280, #9aa1ad);
      border-top: 1px solid light-dark(rgba(17,24,39,.08), rgba(255,255,255,.1));
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="brand">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2L12 2z" fill="#6366f1"/>
    </svg>
    SWYM
  </div>
  <div class="status" id="status">Checking…</div>
  <button id="settings">Open Settings</button>
  <div class="tip">
    No API key? Settings has <b>free</b> options (Google Gemini / Groq — no credit card).
    On ChatGPT, Claude, Gemini, Perplexity or DeepSeek, a small <b>Improve</b> chip appears
    above the message box once you've typed a few words. Shortcut: <b>Alt+Shift+I</b>.
  </div>
  <script src="popup.js"></script>
</body>
</html>
